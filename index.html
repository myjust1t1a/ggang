<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>휴대폰 엿보기</title>
<meta name="description" content="본문의 링크를 누르면 등장인물의 휴대폰을 열어볼 수 있는 페이지">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;600&family=Noto+Serif+KR:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css?v=202610161738">
</head>
<body>
  <main id="story" class="story"></main>

  <div id="phoneLayer" class="phone-layer" aria-hidden="true">
    <div class="backdrop" data-close></div>
    <div id="device" class="device">
      <div class="statusbar" id="statusbar">
        <span class="sb-time" id="sbTime"></span>
        <span class="sb-icons">
          <svg viewBox="0 0 18 12" width="17" height="11"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <svg viewBox="0 0 16 12" width="15" height="11"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .4 10.4 10.4 0 0 0 .8 3.3L2 4.6a8.6 8.6 0 0 1 6-2.4zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.7 6.7 0 0 0 8 4a6.7 6.7 0 0 0-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3zM8 9.4l1.9-2a2.8 2.8 0 0 0-3.8 0z"/></svg>
          <span class="battery"><i></i></span>
        </span>
      </div>
      <div id="screens" class="screens"></div>
      <div id="banner" class="banner" hidden></div>
      <button class="homebar" id="homebar" aria-label="홈으로"><i></i></button>
    </div>
    <button class="close-phone" data-close aria-label="휴대폰 닫기">✕</button>
  </div>

  <script src="data.js?v=202610161738"></script>
  <script src="app.js?v=202610161738"></script>
</body>
</html>
